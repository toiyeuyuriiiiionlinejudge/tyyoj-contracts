[package]
name = "tyyoj-contracts"
version = "0.1.0"
edition = "2021"
authors = ["toiyeuyuriiiii & nmkdeveloper"]
license = "MIT"
repository = "https://github.com/toiyeuyuriiiiionlinejudge/tyyoj-contracts"
description = "Shared schemas, DTOs, and OpenAPI models for Toi Yêu Yuri Online Judge"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
